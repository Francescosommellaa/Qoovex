name: Rehearse Workspace Preview

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to rehearse
        required: true
        type: string
      confirmation:
        description: Type RECREATE_ISOLATED_PREVIEW
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-preview-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Preview / cloud migration rehearsal
    runs-on: ubuntu-latest
    environment: Preview – qoovex-workspace
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_WORKSPACE_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'fra-project' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify manual Preview checkpoint
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "RECREATE_ISOLATED_PREVIEW"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Verify Vercel credentials and exact Preview checkpoint
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Capture current Production alias identity
        id: before
        run: |
          production_id="$(pnpm dlx vercel@50.17.1 inspect https://app.qoovex.com --json \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" | jq -r '.id')"
          test -n "$production_id"
          echo "production_id=$production_id" >> "$GITHUB_OUTPUT"

      - name: Deploy Preview through the Vercel cloud build
        id: preview
        run: |
          deployment_url="$(pnpm dlx vercel@50.17.1 deploy --yes --force \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --meta "releaseSha=${RELEASE_SHA}")"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke Preview and prove Production alias invariance
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.url }}
          PRODUCTION_ID_BEFORE: ${{ steps.before.outputs.production_id }}
        run: |
          auth_header=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            auth_header=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          expect_status() {
            expected="$1"
            path="$2"
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "${auth_header[@]}" "${DEPLOYMENT_URL}${path}")"
            test "$actual" = "$expected"
          }
          expect_status 200 /sign-in
          expect_status 307 /
          expect_status 307 /client
          expect_status 401 /api/account/notification-preferences
          expect_status 404 /api/does-not-exist
          production_id_after="$(pnpm dlx vercel@50.17.1 inspect https://app.qoovex.com --json \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" | jq -r '.id')"
          test "$production_id_after" = "$PRODUCTION_ID_BEFORE"

      - name: Write secret-free Preview evidence
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.url }}
        run: |
          jq -n \
            --arg sha "$RELEASE_SHA" \
            --arg migrationHead "$(node -p "require('./ops/workspace-release-manifest.json').database.migrationHead")" \
            --arg deploymentUrl "$DEPLOYMENT_URL" \
            --arg migration "cloud-build-forward" \
            --arg productionAlias "unchanged" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha:$sha,migrationHead:$migrationHead,deploymentUrl:$deploymentUrl,migration:$migration,productionAlias:$productionAlias,timestamp:$timestamp}' \
            > workspace-preview-rehearsal.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-preview-rehearsal-${{ env.RELEASE_SHA }}
          path: workspace-preview-rehearsal.json
          if-no-files-found: error
          retention-days: 30
