name: Rehearse Workspace Preview

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit SHA to rehearse
        required: true
        type: string
      preview_branch:
        description: Vercel Preview environment branch selector
        required: true
        type: string
      confirmation:
        description: Type RECREATE_ISOLATED_PREVIEW
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workspace-preview-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Preview / isolated vNext rehearsal
    runs-on: ubuntu-latest
    environment: Preview – qoovex-workspace
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      PREVIEW_BRANCH: ${{ inputs.preview_branch }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_WORKSPACE_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'fra-project' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Verify manual Preview checkpoint
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "RECREATE_ISOLATED_PREVIEW"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Verify Vercel credentials
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Verify exact Preview checkpoint
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - run: pnpm ci:install
      - run: pnpm check:push

      - name: Prove Preview environment isolation without printing values
        run: |
          mkdir -p .release-tmp
          pnpm dlx vercel@50.17.1 env pull .release-tmp/preview.env --yes --environment=preview \
            --git-branch="$PREVIEW_BRANCH" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          pnpm dlx vercel@50.17.1 env pull .release-tmp/production.env --yes --environment=production \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          node scripts/verify-environment-contract.mjs preview .release-tmp/preview.env
          node scripts/verify-environment-contract.mjs production .release-tmp/production.env
          node scripts/verify-environment-isolation.mjs .release-tmp/preview.env .release-tmp/production.env

      - name: Capture current Production alias identity
        id: before
        run: |
          production_id="$(pnpm dlx vercel@50.17.1 inspect https://app.qoovex.com --json \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" | jq -r '.id')"
          test -n "$production_id"
          echo "production_id=$production_id" >> "$GITHUB_OUTPUT"

      - name: Reset isolated Preview Blob store
        env:
          QOOVEX_VNEXT_BLOB_RESET_APPROVED: RESET_QOOVEX_VNEXT_EMPTY_BLOB_STORE_2026_08_03
        run: >-
          pnpm dlx vercel@50.17.1 env run -e preview --git-branch="$PREVIEW_BRANCH"
          --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --
          pnpm --filter @qoovex/workspace blob:vnext:reset

      - name: Recreate isolated Preview database from vNext migrations
        env:
          QOOVEX_PREVIEW_RECREATE_APPROVED: RECREATE_ISOLATED_PREVIEW
        run: >-
          pnpm dlx vercel@50.17.1 env run -e preview --git-branch="$PREVIEW_BRANCH"
          --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --
          pnpm --filter @qoovex/db db:preview:recreate

      - name: Verify Preview migration status and drift
        run: >-
          pnpm dlx vercel@50.17.1 env run -e preview --git-branch="$PREVIEW_BRANCH"
          --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --
          pnpm --filter @qoovex/db exec sh -c
          'prisma migrate status && prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code'

      - name: Run E2E with isolated Preview database, Blob and local email sink
        run: >-
          pnpm dlx vercel@50.17.1 env run -e preview --git-branch="$PREVIEW_BRANCH"
          --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" --
          sh -c 'export QOOVEX_E2E_MODE=1;
          export QOOVEX_E2E_DATABASE_TARGET="${DATABASE_URL:-${DATABASE_PRISMA_DATABASE_URL:-$DATABASE_POSTGRES_URL}}";
          export QOOVEX_E2E_BLOB_TARGET="$BLOB_STORE_ID";
          export QOOVEX_E2E_RUN_ATTESTATION=I_ACKNOWLEDGE_FIXTURE_SCOPED_CLEANUP;
          pnpm test:e2e'

      - name: Build and deploy Preview artifact
        id: preview
        run: |
          pnpm dlx vercel@50.17.1 pull --yes --environment=preview --git-branch="$PREVIEW_BRANCH" \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          pnpm dlx vercel@50.17.1 build --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
          deployment_url="$(pnpm dlx vercel@50.17.1 deploy --prebuilt --yes \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE")"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke Preview and prove Production alias invariance
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.url }}
          PRODUCTION_ID_BEFORE: ${{ steps.before.outputs.production_id }}
        run: |
          auth_header=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            auth_header=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          expect_status() {
            expected="$1"
            path="$2"
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "${auth_header[@]}" "${DEPLOYMENT_URL}${path}")"
            test "$actual" = "$expected"
          }
          expect_status 200 /sign-in
          expect_status 307 /contexts
          expect_status 307 /client
          expect_status 401 /api/contexts
          expect_status 404 /api/does-not-exist
          production_id_after="$(pnpm dlx vercel@50.17.1 inspect https://app.qoovex.com --json \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" | jq -r '.id')"
          test "$production_id_after" = "$PRODUCTION_ID_BEFORE"

      - name: Write secret-free Preview evidence
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.url }}
        run: |
          jq -n \
            --arg sha "$RELEASE_SHA" \
            --arg migrationHead "20260803230000_qoovex_vnext_from_zero" \
            --arg deploymentUrl "$DEPLOYMENT_URL" \
            --arg isolation "verified" \
            --arg database "recreated-vnext" \
            --arg blob "reset-private" \
            --arg e2e "passed" \
            --arg rollbackProof "production-alias-unchanged" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha:$sha,migrationHead:$migrationHead,deploymentUrl:$deploymentUrl,isolation:$isolation,database:$database,blob:$blob,e2e:$e2e,rollbackProof:$rollbackProof,timestamp:$timestamp}' \
            > workspace-preview-rehearsal.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-preview-rehearsal-${{ env.RELEASE_SHA }}
          path: workspace-preview-rehearsal.json
          if-no-files-found: error
          retention-days: 30
