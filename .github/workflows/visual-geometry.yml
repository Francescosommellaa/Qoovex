name: Visual Geometry

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-geometry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-geometry:
    name: visual-geometry
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-noble
    env:
      CI: "true"
      QOOVEX_VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Prove fail-closed visual behavior
        run: pnpm visual:geometry:self-test
      - name: Verify committed diff whitespace
        run: git -C "$GITHUB_WORKSPACE" diff --check
      - name: Verify governed geometry and screenshots
        run: pnpm visual:geometry
      - name: Summarize visual results
        if: always()
        continue-on-error: true
        run: pnpm visual:geometry:report
      - name: Upload visual failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-geometry-${{ github.sha }}
          path: output/visual-geometry/
          if-no-files-found: ignore
          retention-days: 7
