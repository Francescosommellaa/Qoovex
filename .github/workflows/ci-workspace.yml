name: CI - Workspace

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - "apps/workspace/**"
      - "apps/sirio/**"
      - "packages/ui/**"
      - "packages/db/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-workspace.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/workspace/**"
      - "apps/sirio/**"
      - "packages/ui/**"
      - "packages/db/**"
      - "packages/types/**"
      - "packages/utils/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-workspace.yml"

permissions:
  contents: read

concurrency:
  group: ci-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Build workspace app
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/qoovex_ci' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Precompile Sirio UI package
        run: pnpm --filter @qoovex/ui build

      - name: Generate Prisma client
        run: pnpm --filter @qoovex/db db:generate

      - name: Type-check workspace
        run: pnpm --filter @qoovex/workspace type-check

      - name: Lint workspace
        run: pnpm --filter @qoovex/workspace lint

      - name: Run end-to-end tests when present
        run: pnpm --filter @qoovex/workspace --if-present test:e2e

      - name: Build workspace
        run: pnpm --filter @qoovex/workspace build
