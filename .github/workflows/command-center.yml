name: Command Center

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task root da eseguire
        required: true
        type: choice
        default: check:ci
        options:
          - check:ci
          - check:fast
          - check:repo
          - lint
          - type-check
          - check:build
          - check:audit

permissions:
  contents: read

concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run selected task
        run: pnpm ${{ inputs.task }}
