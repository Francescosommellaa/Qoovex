name: Scheduled jobs

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Job da eseguire
        required: true
        default: all
        type: choice
        options:
          - all
          - data-control
          - vnext-processes

permissions:
  contents: read

jobs:
  data-control:
    if: github.event.schedule == '3-58/5 * * * *' || inputs.target == 'all' || inputs.target == 'data-control'
    runs-on: ubuntu-latest
    concurrency:
      group: scheduled-data-control
      cancel-in-progress: false
    steps:
      - name: Run data-control queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WORKSPACE_BASE_URL: ${{ vars.WORKSPACE_BASE_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$WORKSPACE_BASE_URL"
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 10 --max-time 240 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$WORKSPACE_BASE_URL/api/data/jobs/run")"
          jq -e 'type == "object" and ((.failed | type) == "number") and .failed == 0' <<<"$response" >/dev/null

  vnext-processes:
    if: github.event.schedule == '3-58/5 * * * *' || inputs.target == 'all' || inputs.target == 'vnext-processes'
    runs-on: ubuntu-latest
    concurrency:
      group: scheduled-vnext-processes
      cancel-in-progress: false
    steps:
      - name: Run vNext process queue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WORKSPACE_BASE_URL: ${{ vars.WORKSPACE_BASE_URL }}
        run: |
          test -n "$CRON_SECRET"
          test -n "$WORKSPACE_BASE_URL"
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 10 --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$WORKSPACE_BASE_URL/api/internal/vnext/processes/run")"
          jq -e 'type == "object" and ((.failed | type) == "number") and .failed == 0' <<<"$response" >/dev/null
