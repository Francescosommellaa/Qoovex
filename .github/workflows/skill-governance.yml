name: Skill Governance

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-governance:
    name: skill-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm ci:install
      - name: Run skill governance tests
        run: pnpm skills:test
      - name: Run skill doctor
        run: pnpm skills:doctor -- --ci
      - name: Run deterministic routing canary
        run: pnpm skills:canary
      - run: git diff --check
