name: CI - Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/sirio/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-web.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/web/**"
      - "apps/sirio/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build web site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Precompile Sirio UI package
        run: pnpm --filter @qoovex/ui build

      - name: Optimize web images when present
        run: pnpm --filter @qoovex/web --if-present optimize:images

      - name: Type-check web
        run: pnpm --filter @qoovex/web type-check

      - name: Lint web
        run: pnpm --filter @qoovex/web lint

      - name: Build web
        run: pnpm --filter @qoovex/web build

      - name: Run SEO tests when present
        run: pnpm --filter @qoovex/web --if-present test:seo

      - name: Run accessibility tests when present
        run: pnpm --filter @qoovex/web --if-present test:a11y
