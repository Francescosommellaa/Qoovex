name: CI - Sirio

on:
  pull_request:
    paths:
      - "apps/sirio/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-sirio.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "apps/sirio/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-sirio.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-sirio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sirio:
    name: Build design system and Sirio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@qoovex"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-sirio-${{ hashFiles('pnpm-lock.yaml', 'apps/sirio/**', 'packages/ui/**') }}
          restore-keys: |
            ${{ runner.os }}-sirio-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm --filter @qoovex/ui build

      - name: Type-check Sirio
        run: pnpm --filter @qoovex/sirio type-check

      - name: Lint Sirio
        run: pnpm --filter @qoovex/sirio lint

      - name: Run visual tests when present
        run: pnpm --filter @qoovex/sirio --if-present test:visual

      - name: Build Sirio showcase
        run: pnpm --filter @qoovex/sirio build

      - name: Publish UI package to GitHub Packages
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@qoovex/ui@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@qoovex/ui@$VERSION already exists in GitHub Packages. Skipping publish."
          else
            npm publish --access restricted --registry=https://npm.pkg.github.com
          fi
