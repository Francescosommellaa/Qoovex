name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qoovex_ci
  AUTH_URL: http://localhost:3001
  AUTH_SECRET: ci-auth-secret-at-least-32-characters
  DEV_AUTH_SECRET: ci-dev-auth-secret-at-least-32-characters
  QOOVEX_AUTH_CODE_SECRET: ci-auth-code-secret-at-least-32-characters
  QOOVEX_PASSWORD_PEPPER: ci-password-pepper-at-least-32-characters
  QOOVEX_AUDIT_SECRET: ci-audit-secret-at-least-32-characters
  QOOVEX_MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-at-least-32-chars
  QOOVEX_MFA_COOKIE_SECRET: ci-mfa-cookie-secret-at-least-32-chars

jobs:
  quality-gate:
    name: CI / quality-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qoovex_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm ci:install
      - run: pnpm ci:db:prepare
      - run: pnpm check

  workspace-e2e:
    name: CI / workspace-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qoovex_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm ci:install
      - run: pnpm ci:db:prepare
      - run: pnpm test:e2e:install
      - name: Verify isolated E2E targets
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.QOOVEX_E2E_BLOB_READ_WRITE_TOKEN }}
          BLOB_STORE_ID: ${{ vars.QOOVEX_E2E_BLOB_STORE_ID }}
        run: |
          test -n "$BLOB_READ_WRITE_TOKEN"
          test -n "$BLOB_STORE_ID"
      - name: Run Playwright E2E
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.QOOVEX_E2E_BLOB_READ_WRITE_TOKEN }}
          BLOB_STORE_ID: ${{ vars.QOOVEX_E2E_BLOB_STORE_ID }}
          QOOVEX_E2E_MODE: "1"
          QOOVEX_E2E_DATABASE_TARGET: ${{ env.DATABASE_URL }}
          QOOVEX_E2E_BLOB_TARGET: ${{ vars.QOOVEX_E2E_BLOB_STORE_ID }}
          QOOVEX_E2E_RUN_ATTESTATION: I_ACKNOWLEDGE_FIXTURE_SCOPED_CLEANUP
        run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
