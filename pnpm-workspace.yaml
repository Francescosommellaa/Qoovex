packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@hono/node-server": "1.19.13"
  hono: "4.12.25"
  postcss: "8.5.14"
peerDependencyRules:
  ignoreMissing: []
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@full-ui/headless-calendar@7.0.1'
  - '@fullcalendar/core@7.0.1'
  - '@fullcalendar/react@7.0.1'
