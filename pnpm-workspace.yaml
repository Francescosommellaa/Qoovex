packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Prisma's AJV range accepts this patched release; covers both fast-uri advisories.
  fast-uri: "3.1.5"
  # Temporary leaf pins until Prisma 7 ships @prisma/dev with the patched releases.
  # Recheck and remove when upstream catches up; review no later than 2026-08-26.
  find-my-way: "9.7.0"
  valibot: "1.4.2"
  postcss: "8.5.25"
  # postcss pulls nanoid <3.3.17 which has GHSA-2v37-7h3g-55p8 (custom generator infinite loop).
  nanoid: ">=3.3.17"
auditConfig:
  ignoreGhsas:
    # Temporary: Next 16.2.x supports sharp ^0.34.5, while the patched release is >=0.35.0.
    # Remove after Next supports sharp 0.35; review no later than 2026-08-22.
    - GHSA-f88m-g3jw-g9cj
peerDependencyRules:
  ignoreMissing: []
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - fast-uri@3.1.5
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - turbo@2.10.10
